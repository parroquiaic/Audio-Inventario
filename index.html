<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventario de audio</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --tx: #101828; --tx2: #475467; --line: #d0d5dd;
    --pri: #1f3a5f; --pri-tx: #ffffff; --sel: #e8eef7;
    --ok: #067647; --ok-bg: #dcfae6; --warn: #93370d; --warn-bg: #fef0c7; --bad: #b42318; --bad-bg: #fee4e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1419; --card: #18202a; --tx: #eef2f6; --tx2: #a4b0bf; --line: #334155;
      --pri: #7fa8e0; --pri-tx: #0b1522; --sel: #1e2b3d;
      --ok: #75e0a7; --ok-bg: #0f3a28; --warn: #fec84b; --warn-bg: #4a3207; --bad: #fda29b; --bad-bg: #4d1511;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--tx);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 48px; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 0 10px; }
  h1 { margin: 0; font-size: 1.35rem; line-height: 1.2; }
  .sub { margin: 2px 0 0; font-size: .85rem; color: var(--tx2); }

  .btn {
    min-height: 44px; padding: 0 16px; border: 1px solid var(--pri); border-radius: 10px;
    background: var(--pri); color: var(--pri-tx); font: inherit; font-weight: 600; cursor: pointer;
  }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.sec { background: transparent; color: var(--pri); }
  .btn.link { border: 0; background: transparent; color: var(--pri); padding: 0 4px; min-height: 40px; font-weight: 600; }
  .btn:focus-visible, input:focus-visible, summary:focus-visible, .chip:focus-visible, .tab:focus-visible {
    outline: 3px solid var(--pri); outline-offset: 2px;
  }

  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  .tab { min-height: 44px; border: 0; border-radius: 9px; background: transparent; color: var(--tx2); font: inherit; font-weight: 600; cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--pri); color: var(--pri-tx); }
  .badge { display: inline-block; min-width: 22px; margin-left: 6px; padding: 0 6px; border-radius: 11px; background: var(--sel); color: var(--pri); font-size: .8rem; line-height: 22px; }
  .tab[aria-selected="true"] .badge { background: var(--pri-tx); color: var(--pri); }

  .aviso { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); font-size: .92rem; }
  .aviso.error { background: var(--bad-bg); color: var(--bad); }

  .seg { display: flex; gap: 8px; margin: 16px 0 10px; }
  .chip { min-height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 20px; background: var(--card); color: var(--tx); font: inherit; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--sel); border-color: var(--pri); color: var(--pri); font-weight: 600; }

  label { display: block; margin: 14px 0 6px; font-weight: 600; font-size: .92rem; }
  input[type="text"], input[type="search"], input[type="date"], select {
    width: 100%; min-height: 46px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--tx); font: inherit;
  }
  select { margin-top: 10px; }
  .row { display: flex; gap: 8px; }
  .row > input { flex: 1; min-width: 0; }

  .count { margin: 10px 0 8px; font-size: .85rem; color: var(--tx2); }
  .lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .item {
    width: 100%; text-align: left; display: block; padding: 12px 14px; border: 1px solid var(--line);
    border-radius: 12px; background: var(--card); color: var(--tx); font: inherit; cursor: pointer;
  }
  .item:hover { border-color: var(--pri); }
  .item .l1 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .id { font: 600 .82rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--tx2); }
  .nombre { font-weight: 600; }
  .meta { margin-top: 2px; font-size: .88rem; color: var(--tx2); }
  .tag { display: inline-block; padding: 1px 9px; border-radius: 10px; font-size: .78rem; font-weight: 600; background: var(--sel); color: var(--pri); }
  .tag.ok { background: var(--ok-bg); color: var(--ok); }
  .tag.warn { background: var(--warn-bg); color: var(--warn); }
  .tag.bad { background: var(--bad-bg); color: var(--bad); }

  .card { padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
  .card h2 { margin: 2px 0 12px; font-size: 1.2rem; }
  dl { margin: 0; display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; }
  dt { color: var(--tx2); font-size: .9rem; }
  dd { margin: 0; overflow-wrap: anywhere; }
  h3 { margin: 20px 0 8px; font-size: 1rem; }
  .hist { margin: 0; padding-left: 18px; }
  .hist li { margin: 4px 0; }
  .acciones { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  .vacio { padding: 18px 8px; text-align: center; color: var(--tx2); }

  details.act { border: 1px solid var(--line); border-radius: 12px; background: var(--card); padding: 0 14px; }
  details.act + details.act { margin-top: 8px; }
  details.act summary { min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; font-weight: 600; }
  details.act ul { margin: 0 0 12px; padding-left: 18px; font-size: .92rem; }

  .uso { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; }
  .uso li { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
  .quitar { min-height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--bad); font: inherit; cursor: pointer; }
  .final { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  .msg { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--ok-bg); color: var(--ok); }
  .msg.error { background: var(--bad-bg); color: var(--bad); }
  .ayuda { margin: 6px 0 0; font-size: .85rem; color: var(--tx2); }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1>Inventario de audio</h1>
      <p class="sub" id="estadoCarga">Sin cargar</p>
    </div>
    <button class="btn" id="btnActualizar" type="button">Actualizar</button>
  </header>

  <nav class="tabs" role="tablist" aria-label="Secciones">
    <button class="tab" role="tab" id="tabConsultar" data-vista="consultar" aria-selected="true">Consultar</button>
    <button class="tab" role="tab" id="tabActividad" data-vista="actividad" aria-selected="false">Actividad<span class="badge" id="badge" hidden>0</span></button>
  </nav>

  <div id="aviso" class="aviso" role="alert" hidden></div>

  <!-- ===== CONSULTAR ===== -->
  <main id="vistaConsultar">

    <div class="seg" id="modos">
      <button class="chip" type="button" data-modo="equipos" aria-pressed="true">Equipos</button>
      <button class="chip" type="button" data-modo="actividades" aria-pressed="false">Actividades recientes</button>
    </div>

    <section id="panelEquipos">
      <label for="buscar" style="margin-top:0">Buscar por ID, descripción, tipo, marca o conectores</label>
      <input type="search" id="buscar" autocomplete="off" placeholder="Ej. CAB-001, XLR, micrófono">
      <select id="filtroTipo" aria-label="Filtrar por tipo"></select>
      <p class="count" id="contador"></p>
      <ul class="lista" id="lista"></ul>
    </section>

    <section id="panelActividades" hidden>
      <div id="listaActividades"></div>
    </section>

    <section id="panelDetalle" hidden></section>
  </main>

  <!-- ===== ACTIVIDAD ===== -->
  <main id="vistaActividad" hidden>
    <label for="actNombre" style="margin-top:16px">Nombre de la actividad</label>
    <input type="text" id="actNombre" maxlength="120" autocomplete="off" placeholder="Ej. Misa dominical">

    <label for="actFecha">Fecha</label>
    <input type="date" id="actFecha">

    <label for="actEquipo">Agregar un equipo (ID o nombre)</label>
    <div class="row">
      <input type="text" id="actEquipo" list="listaEquipos" autocomplete="off" placeholder="Ej. CAB-001">
      <button class="btn sec" id="btnAgregar" type="button">Agregar</button>
    </div>
    <datalist id="listaEquipos"></datalist>
    <p class="ayuda">También puedes escanear una etiqueta NFC, tocar “Agregar a la actividad” en la ficha y volver a escanear la siguiente. La lista se conserva en este teléfono hasta que envíes el registro.</p>

    <h3>Equipos usados <span id="totalUso"></span></h3>
    <ul class="uso" id="listaUso"></ul>

    <div class="final">
      <button class="btn" id="btnEnviar" type="button">Enviar registro</button>
      <button class="btn sec" id="btnVaciar" type="button">Vaciar lista</button>
    </div>
    <div id="mensajeAct" role="status" aria-live="polite" hidden></div>
  </main>

  <noscript><p class="aviso error">Esta página necesita JavaScript.</p></noscript>
</div>

<script>
'use strict';

/* ================= CONFIGURACIÓN ================= */
// Pega aquí la URL de la implementación de Apps Script (termina en /exec).
const API_URL = 'https://script.google.com/macros/s/AKfycbxIRMrbv9gSjEgggD_3WcdvBPotbbIuGKO0g_n31HbTz8XrQ2rYFvDfMMx2CQ4tOjU0/exec';

/* ================= ESTADO ================= */
const CLAVE_BORRADOR = 'inventario_audio_actividad';
const estado = {
  vista: 'consultar', modo: 'equipos', tipo: 'Todos', busqueda: '',
  equipos: [], actividades: [], detalle: null, cargando: false, hora: null
};
let borrador = cargarBorrador();

/* ================= UTILIDADES ================= */
const $ = (s) => document.querySelector(s);

function el(tag, props, ...hijos) {
  const n = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (k === 'class') n.className = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) n.setAttribute(k, v === true ? '' : v);
    }
  }
  for (const h of hijos.flat(Infinity)) {
    if (h === null || h === undefined || h === false) continue;
    n.append(h.nodeType ? h : document.createTextNode(String(h)));
  }
  return n;
}

function norm(s) {
  return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
}

function hoy() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

function fechaBonita(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ''));
  if (!m) return s || '';
  const meses = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  return Number(m[3]) + ' ' + meses[Number(m[2]) - 1] + ' ' + m[1];
}

function claseEstado(e) {
  const t = norm(e);
  if (t === 'bueno') return 'ok';
  if (t === 'regular') return 'warn';
  if (t) return 'bad';
  return '';
}

function buscarEquipo(id) {
  const t = norm(id).trim();
  return estado.equipos.find((e) => norm(e.id) === t) || null;
}

/* ================= BORRADOR (se guarda en el teléfono) ================= */
function cargarBorrador() {
  try {
    const d = JSON.parse(localStorage.getItem(CLAVE_BORRADOR) || 'null');
    if (d && Array.isArray(d.ids)) return { nombre: String(d.nombre || ''), fecha: String(d.fecha || ''), ids: d.ids.map(String) };
  } catch (e) { /* sin almacenamiento: se trabaja en memoria */ }
  return { nombre: '', fecha: '', ids: [] };
}
function guardarBorrador() {
  try { localStorage.setItem(CLAVE_BORRADOR, JSON.stringify(borrador)); } catch (e) { /* sin almacenamiento */ }
}

/* ================= API ================= */
function apiConfigurada() {
  return /^https:\/\/script\.google\.com\/.+\/exec$/.test(API_URL);
}

async function leerRespuesta(r) {
  if (!r.ok) throw new Error('No se pudo conectar (' + r.status + ').');
  let d;
  try { d = await r.json(); } catch (e) { throw new Error('La respuesta no es válida. Revisa la implementación de Apps Script.'); }
  if (!d.ok) throw new Error(d.error || 'Error desconocido.');
  return d;
}
async function apiGet(params) {
  return leerRespuesta(await fetch(API_URL + '?' + new URLSearchParams(params)));
}
async function apiPost(cuerpo) {
  // text/plain evita la comprobación previa (preflight) que Apps Script no admite
  return leerRespuesta(await fetch(API_URL, {
    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(cuerpo)
  }));
}

/* ================= AVISOS ================= */
function aviso(texto, esError) {
  const a = $('#aviso');
  if (!texto) { a.hidden = true; a.textContent = ''; return; }
  a.className = 'aviso' + (esError ? ' error' : '');
  a.textContent = texto;
  a.hidden = false;
}
function mensajeActividad(texto, esError) {
  const m = $('#mensajeAct');
  if (!texto) { m.hidden = true; m.textContent = ''; return; }
  m.className = 'msg' + (esError ? ' error' : '');
  m.textContent = texto;
  m.hidden = false;
}

/* ================= ACTUALIZAR ================= */
async function actualizar() {
  if (!apiConfigurada()) {
    aviso('Falta configurar la página: pega la URL de Apps Script en la constante API_URL de index.html.', true);
    return;
  }
  if (estado.cargando) return;
  estado.cargando = true;
  $('#btnActualizar').disabled = true;
  $('#btnActualizar').textContent = 'Actualizando…';
  try {
    const [a, b] = await Promise.all([apiGet({ accion: 'listar' }), apiGet({ accion: 'actividades' })]);
    estado.equipos = a.equipos;
    estado.actividades = b.actividades;
    estado.hora = new Date();
    aviso('');
  } catch (err) {
    aviso('No se pudo actualizar: ' + err.message, true);
  } finally {
    estado.cargando = false;
    $('#btnActualizar').disabled = false;
    $('#btnActualizar').textContent = 'Actualizar';
    render();
  }
}

/* ================= DETALLE ================= */
async function abrirDetalle(id) {
  const e = buscarEquipo(id);
  if (!e) { aviso('No se encontró el equipo ' + id + '.', true); return; }
  const d = { equipo: e, historial: null, error: null };
  estado.detalle = d;
  estado.vista = 'consultar';
  window.scrollTo(0, 0);
  render();
  try {
    const r = await apiGet({ accion: 'equipo', id: e.id });
    d.equipo = r.equipo;
    d.historial = r.historial;
  } catch (err) {
    d.error = err.message;
    d.historial = [];
  }
  if (estado.detalle === d) render();
}

function cerrarDetalle() {
  estado.detalle = null;
  render();
}

/* ================= ACTIVIDAD ================= */
function agregarAlBorrador(id) {
  const e = buscarEquipo(id);
  const real = e ? e.id : id;
  if (!borrador.ids.some((x) => norm(x) === norm(real))) {
    borrador.ids.push(real);
    guardarBorrador();
  }
}

function resolverTexto(texto) {
  const t = norm(texto).trim();
  if (!t) return null;
  const base = norm(texto.split('—')[0]).trim();
  return estado.equipos.find((e) => norm(e.id) === base)
    || estado.equipos.find((e) => norm(e.id) === t)
    || estado.equipos.find((e) => norm(e.descripcion) === t)
    || null;
}

function agregarDesdeCampo() {
  const campo = $('#actEquipo');
  const e = resolverTexto(campo.value);
  if (!campo.value.trim()) return;
  if (!e) {
    mensajeActividad('No se encontró ese equipo. Revisa el ID o toca Actualizar.', true);
    return;
  }
  agregarAlBorrador(e.id);
  campo.value = '';
  mensajeActividad('');
  render();
}

async function enviarRegistro() {
  const nombre = borrador.nombre.trim();
  if (!nombre) return mensajeActividad('Escribe el nombre de la actividad.', true);
  if (!borrador.fecha) return mensajeActividad('Elige la fecha.', true);
  if (!borrador.ids.length) return mensajeActividad('Agrega al menos un equipo.', true);
  if (!apiConfigurada()) return mensajeActividad('Falta configurar la URL de Apps Script en index.html.', true);

  const btn = $('#btnEnviar');
  btn.disabled = true;
  btn.textContent = 'Enviando…';
  try {
    const r = await apiPost({ accion: 'registrarActividad', nombre, fecha: borrador.fecha, equipos: borrador.ids });
    borrador.ids = [];
    borrador.nombre = '';
    guardarBorrador();
    mensajeActividad('Registro enviado: “' + nombre + '” con ' + r.total + (r.total === 1 ? ' equipo.' : ' equipos.'));
    await actualizar();
  } catch (err) {
    mensajeActividad('No se pudo enviar: ' + err.message + ' Revisa en Consultar > Actividades recientes antes de volver a enviar.', true);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Enviar registro';
    render();
  }
}

/* ================= RENDER ================= */
function render() {
  renderEstado();
  renderTabs();
  renderConsultar();
  renderActividad();
}

function renderEstado() {
  $('#estadoCarga').textContent = estado.hora
    ? 'Actualizado a las ' + estado.hora.toLocaleTimeString('es-PA', { hour: '2-digit', minute: '2-digit' })
    : 'Sin cargar';
}

function renderTabs() {
  const enConsultar = estado.vista === 'consultar';
  $('#tabConsultar').setAttribute('aria-selected', String(enConsultar));
  $('#tabActividad').setAttribute('aria-selected', String(!enConsultar));
  $('#vistaConsultar').hidden = !enConsultar;
  $('#vistaActividad').hidden = enConsultar;
  const b = $('#badge');
  b.hidden = borrador.ids.length === 0;
  b.textContent = borrador.ids.length;
}

function tarjetaEquipo(e) {
  return el('li', null,
    el('button', { class: 'item', type: 'button', onclick: () => abrirDetalle(e.id) },
      el('div', { class: 'l1' }, el('span', { class: 'nombre' }, e.descripcion || e.id), el('span', { class: 'id' }, e.id)),
      el('div', { class: 'meta' },
        el('span', { class: 'tag' }, e.tipo || 'Equipo'), ' ',
        e.marca || '', ' ',
        e.estado ? el('span', { class: 'tag ' + claseEstado(e.estado) }, e.estado) : null)
    )
  );
}

function renderConsultar() {
  const enDetalle = !!estado.detalle;
  $('#modos').hidden = enDetalle;
  $('#panelEquipos').hidden = enDetalle || estado.modo !== 'equipos';
  $('#panelActividades').hidden = enDetalle || estado.modo !== 'actividades';
  $('#panelDetalle').hidden = !enDetalle;

  document.querySelectorAll('#modos .chip').forEach((c) => c.setAttribute('aria-pressed', String(c.dataset.modo === estado.modo)));

  // Filtro por tipo: las opciones salen de los tipos que hay en el inventario
  const tipos = [...new Set(estado.equipos.map((e) => e.tipo).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'es'));
  if (estado.tipo !== 'Todos' && !tipos.includes(estado.tipo)) estado.tipo = 'Todos';
  const sel = $('#filtroTipo');
  sel.replaceChildren(el('option', { value: 'Todos' }, 'Todos los tipos'), ...tipos.map((t) => el('option', { value: t }, t)));
  sel.value = estado.tipo;

  // Lista de equipos
  const q = norm(estado.busqueda);
  const filtrados = estado.equipos.filter((e) =>
    (estado.tipo === 'Todos' || e.tipo === estado.tipo) &&
    (!q || norm([e.id, e.tipo, e.descripcion, e.marca, e.conectores].join(' ')).includes(q)));
  $('#contador').textContent = estado.equipos.length
    ? filtrados.length + (filtrados.length === 1 ? ' equipo' : ' equipos')
    : '';
  const lista = $('#lista');
  lista.replaceChildren();
  if (!filtrados.length) {
    lista.append(el('li', { class: 'vacio' }, estado.equipos.length ? 'No hay equipos que coincidan.' : 'Toca Actualizar para cargar el inventario.'));
  } else {
    filtrados.forEach((e) => lista.append(tarjetaEquipo(e)));
  }

  // Actividades recientes
  const cont = $('#listaActividades');
  cont.replaceChildren();
  if (!estado.actividades.length) {
    cont.append(el('p', { class: 'vacio' }, 'Todavía no hay actividades registradas.'));
  } else {
    estado.actividades.forEach((a) => cont.append(
      el('details', { class: 'act' },
        el('summary', null, el('span', null, a.nombre), el('span', { class: 'id' }, fechaBonita(a.fecha))),
        el('ul', null, a.equipos.length
          ? a.equipos.map((x) => el('li', null, x.descripcion || x.id, ' ', el('span', { class: 'id' }, x.id)))
          : el('li', null, 'Sin equipos registrados.'))
      )));
  }

  renderDetalle();
}

function renderDetalle() {
  const box = $('#panelDetalle');
  box.replaceChildren();
  const d = estado.detalle;
  if (!d) return;
  const e = d.equipo;

  const campos = [
    ['Tipo', e.tipo],
    ['Longitud', e.longitud ? e.longitud + ' ft' : ''],
    ['Conectores', e.conectores],
    ['Marca / Modelo', e.marca],
    ['Color de cinta', e.cinta],
    ['Estado', e.estado],
    ['Asignado a', e.asignado],
    ['Última revisión', e.revision ? fechaBonita(e.revision) : ''],
    ['Notas', e.notas]
  ].filter(([, v]) => v);
  const dl = el('dl', null, campos.map(([k, v]) => [el('dt', null, k), el('dd', null, k === 'Estado' ? el('span', { class: 'tag ' + claseEstado(v) }, v) : v)]));

  let historial;
  if (d.historial === null) historial = el('p', { class: 'meta' }, 'Cargando…');
  else if (d.error) historial = el('p', { class: 'meta' }, 'No se pudo cargar el historial: ' + d.error);
  else if (!d.historial.length) historial = el('p', { class: 'meta' }, 'Todavía no se ha usado en ninguna actividad.');
  else historial = el('ul', { class: 'hist' }, d.historial.map((h) => el('li', null, fechaBonita(h.fecha), ' · ', h.nombre)));

  const yaEsta = borrador.ids.some((x) => norm(x) === norm(e.id));
  box.append(
    el('button', { class: 'btn link', type: 'button', onclick: cerrarDetalle }, '← Volver a la lista'),
    el('article', { class: 'card' },
      el('div', { class: 'id' }, e.id),
      el('h2', null, e.descripcion || e.id),
      dl,
      el('h3', null, 'Últimas actividades'),
      historial,
      el('div', { class: 'acciones' },
        el('button', {
          class: 'btn', type: 'button', disabled: yaEsta,
          onclick: () => { agregarAlBorrador(e.id); render(); }
        }, yaEsta ? 'Ya está en la actividad' : 'Agregar a la actividad'),
        yaEsta ? el('button', { class: 'btn sec', type: 'button', onclick: () => { estado.vista = 'actividad'; render(); } }, 'Ver actividad') : null)
    )
  );
}

function renderActividad() {
  if ($('#actNombre').value !== borrador.nombre) $('#actNombre').value = borrador.nombre;
  if (!borrador.fecha) { borrador.fecha = hoy(); guardarBorrador(); }
  if ($('#actFecha').value !== borrador.fecha) $('#actFecha').value = borrador.fecha;

  const dl = $('#listaEquipos');
  dl.replaceChildren();
  estado.equipos.forEach((e) => dl.append(el('option', { value: e.id + ' — ' + (e.descripcion || '') })));

  $('#totalUso').textContent = borrador.ids.length ? '(' + borrador.ids.length + ')' : '';
  const ul = $('#listaUso');
  ul.replaceChildren();
  if (!borrador.ids.length) {
    ul.append(el('li', { class: 'vacio', style: 'display:block;border:0;background:transparent' }, 'Aún no has agregado equipos.'));
  }
  borrador.ids.forEach((id) => {
    const e = buscarEquipo(id);
    ul.append(el('li', null,
      el('span', null, el('span', { class: 'nombre' }, e ? (e.descripcion || e.id) : id), ' ', el('span', { class: 'id' }, id)),
      el('button', {
        class: 'quitar', type: 'button', 'aria-label': 'Quitar ' + id,
        onclick: () => { borrador.ids = borrador.ids.filter((x) => x !== id); guardarBorrador(); render(); }
      }, 'Quitar')));
  });
  $('#btnVaciar').disabled = !borrador.ids.length && !borrador.nombre;
}

/* ================= EVENTOS ================= */
function prepararEventos() {
  $('#btnActualizar').addEventListener('click', actualizar);

  document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => {
    estado.vista = t.dataset.vista;
    render();
  }));
  document.querySelectorAll('#modos .chip').forEach((c) => c.addEventListener('click', () => {
    estado.modo = c.dataset.modo;
    render();
  }));
  $('#filtroTipo').addEventListener('change', (ev) => {
    estado.tipo = ev.target.value;
    renderConsultar();
  });
  $('#buscar').addEventListener('input', (ev) => { estado.busqueda = ev.target.value; renderConsultar(); });

  $('#actNombre').addEventListener('input', (ev) => { borrador.nombre = ev.target.value; guardarBorrador(); renderTabs(); $('#btnVaciar').disabled = false; });
  $('#actFecha').addEventListener('change', (ev) => { borrador.fecha = ev.target.value; guardarBorrador(); });
  $('#btnAgregar').addEventListener('click', agregarDesdeCampo);
  $('#actEquipo').addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); agregarDesdeCampo(); } });
  $('#btnEnviar').addEventListener('click', enviarRegistro);
  $('#btnVaciar').addEventListener('click', () => {
    if (!confirm('¿Vaciar la actividad en curso?')) return;
    borrador.ids = [];
    borrador.nombre = '';
    guardarBorrador();
    mensajeActividad('');
    render();
  });
}

/* ================= INICIO ================= */
async function iniciar() {
  prepararEventos();
  render();
  await actualizar();
  // Una etiqueta NFC abre la página con ?id=CAB-001
  const id = new URLSearchParams(location.search).get('id');
  if (id && estado.equipos.length) abrirDetalle(id);
}
iniciar();
</script>
</body>
</html>
