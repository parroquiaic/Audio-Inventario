<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventario de audio</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --txt:#1b1f24; --mut:#667085; --line:#e3e6ea; --pri:#1f3864; --pri-t:#fff;
          --ok:#1a7f4b; --warn:#b54708; --bad:#b42318; --chip:#eef1f6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#10141a; --card:#1a2029; --txt:#eceff3; --mut:#9aa4b2; --line:#2b323d; --pri:#6f93e0; --pri-t:#0c1220;
            --ok:#4cc38a; --warn:#f0a050; --bad:#f07a70; --chip:#242c38; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); padding-bottom:76px;
         font:16px/1.4 system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--card); border-bottom:1px solid var(--line);
           display:flex; align-items:center; justify-content:space-between; padding:10px 16px; }
  h1 { font-size:18px; margin:0; color:var(--pri); }
  main { max-width:720px; margin:0 auto; padding:16px; }
  section[hidden] { display:none; }
  h2 { font-size:17px; margin:0 0 8px; }
  label { display:block; font-size:13px; color:var(--mut); margin:10px 0 0; }
  input, select, button { font:inherit; }
  input, select { width:100%; padding:10px; margin-top:4px; border:1px solid var(--line); border-radius:8px;
                  background:var(--bg); color:var(--txt); }
  button { cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--txt);
           border-radius:10px; padding:11px 14px; font-weight:600; }
  button.pri { background:var(--pri); color:var(--pri-t); border-color:var(--pri); }
  button:disabled { opacity:.5; cursor:default; }
  .card, .item, details.grupo { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; }
  button.item { display:block; width:100%; text-align:left; font-weight:400; }
  .fila { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .sub { color:var(--mut); font-size:14px; margin-top:2px; }
  .badge { display:inline-block; padding:1px 9px; border-radius:99px; font-size:12px; font-weight:700;
           border:1px solid currentColor; color:var(--mut); white-space:nowrap; }
  .badge.ok { color:var(--ok); } .badge.warn { color:var(--warn); } .badge.bad { color:var(--bad); }
  .chip { background:var(--chip); border-radius:99px; padding:2px 10px; font-size:12px; white-space:nowrap; }
  .filtros { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .vacio { color:var(--mut); text-align:center; padding:24px 0; }
  .err { color:var(--bad); } .okm { color:var(--ok); }
  .seg { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:4px; }
  .seg button[aria-pressed=true] { background:var(--pri); color:var(--pri-t); border-color:var(--pri); }
  .add { display:flex; gap:8px; align-items:flex-end; }
  .add > div { flex:1; }
  .x { padding:2px 9px; border-radius:8px; }
  .botones { display:grid; gap:8px; margin-top:14px; }
  details.grupo summary { cursor:pointer; list-style:none; }
  details.grupo summary::-webkit-details-marker { display:none; }
  .mov { padding:8px 0 0; margin-top:8px; border-top:1px solid var(--line); font-size:15px; }
  dl { display:grid; grid-template-columns:auto 1fr; gap:6px 12px; font-size:15px; margin:12px 0 0; }
  dt { color:var(--mut); } dd { margin:0; word-break:break-word; }
  nav { position:fixed; bottom:0; left:0; right:0; z-index:5; display:flex; background:var(--card); border-top:1px solid var(--line); }
  nav button { flex:1; border:0; border-radius:0; background:none; color:var(--mut); padding:14px 4px; font-size:13px; }
  nav button[aria-selected=true] { color:var(--pri); box-shadow:inset 0 3px 0 var(--pri); }
  #badge { background:var(--pri); color:var(--pri-t); border-radius:99px; padding:0 7px; margin-left:4px; font-size:12px; }
  dialog { width:min(92vw,460px); border:1px solid var(--line); border-radius:14px; background:var(--card); color:var(--txt); padding:18px; }
  dialog::backdrop { background:rgba(0,0,0,.5); }
  #toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); max-width:90vw; background:var(--txt); color:var(--bg);
           padding:10px 16px; border-radius:10px; font-size:14px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:20; }
  #toast.show { opacity:1; } #toast.bad { background:var(--bad); color:#fff; }
</style>
</head>
<body>
<header>
  <h1>Inventario de audio</h1>
  <button id="btnRefrescar" aria-label="Actualizar datos" title="Actualizar">↻</button>
</header>

<main>
  <!-- CONSULTAR -->
  <section id="t-consultar">
    <input id="q" type="search" placeholder="Buscar por ID, nombre, marca, notas…" aria-label="Buscar">
    <div class="filtros">
      <label>Tipo<select id="fTipo"></select></label>
      <label>Estado<select id="fEstado"></select></label>
      <label>Ubicación<select id="fUbic"></select></label>
    </div>
    <p class="sub" id="cuenta"></p>
    <div id="lista"></div>
  </section>

  <!-- ACTIVIDAD -->
  <section id="t-actividad" hidden>
    <div class="card">
      <h2>Registrar actividad</h2>
      <p class="sub">Agrega todas las etiquetas y registra una sola vez. La lista se guarda en este celular hasta que la envíes.</p>
      <label for="actividad">Actividad</label>
      <input id="actividad" placeholder="Ej. Misa del domingo, retiro de jóvenes…" autocomplete="off">
      <label for="responsable">Responsable</label>
      <input id="responsable" placeholder="Tu nombre" autocomplete="name">
      <label>Acción</label>
      <div class="seg">
        <button type="button" data-acc="Salida">Salida</button>
        <button type="button" data-acc="Entrada">Entrada</button>
      </div>
      <label for="ubicacion">Ubicación (donde quedan los equipos)</label>
      <select id="ubicacion"></select>
      <div id="pinBox" hidden>
        <label for="pin">PIN</label>
        <input id="pin" type="password" inputmode="numeric" autocomplete="off">
      </div>
    </div>

    <div class="card">
      <h2>Etiquetas de esta actividad <span id="badge2" class="chip">0</span></h2>
      <div class="add">
        <div><label for="idAdd">ID de la etiqueta</label>
          <input id="idAdd" list="ids" placeholder="Ej. CAB-001" autocapitalize="characters" autocomplete="off"></div>
        <button id="btnAdd" type="button">Agregar</button>
      </div>
      <datalist id="ids"></datalist>
      <div class="botones"><button id="btnNfc" type="button" aria-pressed="false">Leer etiquetas con NFC</button></div>
    </div>

    <div id="items"></div>
    <div class="botones">
      <button id="btnReg" class="pri" type="button" disabled>Registrar actividad (0)</button>
      <button id="btnVaciar" type="button">Vaciar lista</button>
    </div>
    <p id="msgReg" role="status"></p>
  </section>

  <!-- HISTORIAL -->
  <section id="t-historial" hidden>
    <input id="hq" type="search" placeholder="Filtrar por ID, actividad o responsable…" aria-label="Filtrar historial">
    <p class="sub">Últimos movimientos, agrupados por actividad.</p>
    <div id="hlista"></div>
  </section>
</main>

<nav>
  <button id="n-consultar" aria-selected="true">Consultar</button>
  <button id="n-actividad" aria-selected="false">Actividad<span id="badge" hidden></span></button>
  <button id="n-historial" aria-selected="false">Historial</button>
</nav>

<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script>
(function () {
  'use strict';

  // >>> Pega aquí la URL de tu aplicación web de Apps Script (la que termina en /exec) <<<
  const API_URL = 'https://script.google.com/macros/s/AKfycbwet0a-s0RCVJ0fUYuj1tdnzYPDqvslYATx2vBCrsejp8G6SOu8G90V4sqDA4n3Qv2v_Q/exec';

  const $ = s => document.querySelector(s);

  // Crea elementos sin usar innerHTML (los datos de la hoja se muestran siempre como texto)
  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const k in (attrs || {})) {
      const v = attrs[k];
      if (v === false || v == null) continue;
      if (k === 'class') e.className = v;
      else if (k === 'value') e.value = v;
      else if (k.slice(0, 2) === 'on') e[k] = v;
      else e.setAttribute(k, v === true ? '' : v);
    }
    kids.flat(Infinity).forEach(c => { if (c == null || c === false) return; e.append(c.nodeType ? c : String(c)); });
    return e;
  }

  let tt;
  function toast(t, bad) {
    const e = $('#toast'); e.textContent = t; e.className = 'show' + (bad ? ' bad' : '');
    clearTimeout(tt); tt = setTimeout(() => { e.className = ''; }, 3200);
  }

  function load(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  async function apiGet(p) { const r = await fetch(API_URL + '?' + new URLSearchParams(p)); return r.json(); }
  async function apiPost(b) {
    // text/plain evita la comprobación previa (preflight) de CORS, que Apps Script no admite
    const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(b) });
    return r.json();
  }

  // ---------- Estado ----------
  let D = { cables: [], tipos: [], estados: [], ubicaciones: [], requierePin: false };
  const porId = id => D.cables.find(c => c.id.toUpperCase() === String(id).trim().toUpperCase());
  let draft = Object.assign({ actividad: '', responsable: '', accion: 'Salida', ubicacion: '', items: [] }, load('inv_draft', {}));
  if (!Array.isArray(draft.items)) draft.items = [];
  const saveDraft = () => save('inv_draft', draft);
  let hist = null;
  const F = { q: '', tipo: '', estado: '', ubic: '' };

  function claseEstado(e) {
    e = (e || '').toLowerCase();
    if (e === 'bueno') return 'ok';
    if (e === 'con ruido') return 'warn';
    if (e === 'reparar' || e === 'baja') return 'bad';
    return '';
  }

  function llenar(sel, opciones, primero, actual) {
    sel.textContent = '';
    if (primero != null) sel.append(h('option', { value: '' }, primero));
    opciones.forEach(o => sel.append(h('option', { value: o }, o)));
    sel.value = actual || '';
  }

  // ---------- Navegación ----------
  function ir(t) {
    ['consultar', 'actividad', 'historial'].forEach(x => {
      $('#t-' + x).hidden = x !== t;
      $('#n-' + x).setAttribute('aria-selected', String(x === t));
    });
    if (t === 'historial') cargarHistorial();
    window.scrollTo(0, 0);
  }
  ['consultar', 'actividad', 'historial'].forEach(x => { $('#n-' + x).onclick = () => ir(x); });

  // ---------- Consultar ----------
  function pintarLista() {
    const q = F.q.trim().toLowerCase();
    const r = D.cables.filter(c =>
      (!F.tipo || c.tipo === F.tipo) && (!F.estado || c.estado === F.estado) && (!F.ubic || c.ubicacion === F.ubic) &&
      (!q || [c.id, c.descripcion, c.tipo, c.marca, c.asignado, c.notas, c.color].join(' ').toLowerCase().includes(q)));
    $('#cuenta').textContent = r.length + ' de ' + D.cables.length + ' elementos';
    const box = $('#lista'); box.textContent = '';
    if (!r.length) { box.append(h('p', { class: 'vacio' }, 'No hay elementos con ese filtro.')); return; }
    r.forEach(c => box.append(
      h('button', { class: 'item', onclick: () => abrirFicha(c.id) },
        h('div', { class: 'fila' },
          h('strong', null, c.descripcion || c.tipo || c.id),
          h('span', { class: 'badge ' + claseEstado(c.estado) }, c.estado || '—')),
        h('div', { class: 'sub' }, c.id + ' · ' + (c.ubicacion || 'sin ubicación') + (c.asignado ? ' · ' + c.asignado : '')))));
  }

  function abrirFicha(id) {
    const c = porId(id);
    if (!c) { toast('No encontré el ID ' + id + ' en el inventario.', true); return; }
    const dlg = $('#dlg'); dlg.textContent = '';
    const campos = [['Tipo', 'tipo'], ['Longitud (m)', 'longitud'], ['Conectores', 'conectores'], ['Marca / Modelo', 'marca'],
                    ['Color de cinta', 'color'], ['Ubicación', 'ubicacion'], ['Asignado a', 'asignado'],
                    ['Última revisión', 'revision'], ['Notas', 'notas']];
    const dl = h('dl');
    campos.forEach(([et, k]) => { if (c[k]) dl.append(h('dt', null, et), h('dd', null, c[k])); });
    const yaEsta = draft.items.some(i => i.id.toUpperCase() === c.id.toUpperCase());
    dlg.append(
      h('h2', null, c.descripcion || c.tipo || c.id),
      h('div', { class: 'sub' }, c.id + ' · ', h('span', { class: 'badge ' + claseEstado(c.estado) }, c.estado || 'Sin estado')),
      dl,
      h('div', { class: 'botones' },
        h('button', { class: 'pri', disabled: yaEsta, onclick: () => { agregar(c.id); dlg.close(); ir('actividad'); } },
          yaEsta ? 'Ya está en la actividad' : 'Agregar a la actividad'),
        h('button', { onclick: () => { dlg.close(); $('#hq').value = c.id; ir('historial'); } }, 'Ver historial'),
        h('button', { onclick: () => dlg.close() }, 'Cerrar')));
    dlg.showModal();
  }

  $('#q').oninput = e => { F.q = e.target.value; pintarLista(); };
  $('#fTipo').onchange = e => { F.tipo = e.target.value; pintarLista(); };
  $('#fEstado').onchange = e => { F.estado = e.target.value; pintarLista(); };
  $('#fUbic').onchange = e => { F.ubic = e.target.value; pintarLista(); };

  // ---------- Actividad ----------
  function extraerId(t) {
    t = String(t || '').trim();
    if (!t) return '';
    try { const u = new URL(t); const v = u.searchParams.get('id'); if (v) return v; } catch (e) {}
    const m = t.match(/[?&]id=([^&\s]+)/i);
    if (m) return decodeURIComponent(m[1]);
    return /^[A-Za-z0-9_-]+$/.test(t) ? t : '';
  }

  function agregar(id) {
    const c = porId(id);
    if (!c) { toast('El ID "' + id + '" no está en el inventario.', true); return false; }
    if (draft.items.some(i => i.id.toUpperCase() === c.id.toUpperCase())) { toast(c.id + ' ya está en la lista.'); return false; }
    draft.items.push({ id: c.id, estado: c.estado || '', observacion: '' });
    saveDraft(); pintarItems();
    toast('Agregado: ' + c.id + (c.descripcion ? ' – ' + c.descripcion : ''));
    return true;
  }

  function pintarItems() {
    const n = draft.items.length;
    $('#badge2').textContent = n;
    const b = $('#badge'); b.textContent = n; b.hidden = !n;
    const btn = $('#btnReg'); btn.textContent = 'Registrar actividad (' + n + ')'; btn.disabled = !n;
    $('#btnVaciar').disabled = !n;
    const box = $('#items'); box.textContent = '';
    draft.items.forEach((it, i) => {
      const c = porId(it.id) || {};
      const opts = D.estados.slice();
      if (it.estado && !opts.includes(it.estado)) opts.push(it.estado);
      const sel = h('select', { onchange: e => { it.estado = e.target.value; saveDraft(); } });
      opts.forEach(o => sel.append(h('option', { value: o }, o)));
      sel.value = it.estado;
      box.append(h('div', { class: 'item' },
        h('div', { class: 'fila' },
          h('strong', null, it.id + ' · ' + (c.descripcion || c.tipo || '')),
          h('button', { class: 'x', 'aria-label': 'Quitar ' + it.id, onclick: () => { draft.items.splice(i, 1); saveDraft(); pintarItems(); } }, '✕')),
        h('div', { class: 'sub' }, 'Ahora: ' + (c.ubicacion || '—') + (c.asignado ? ' · ' + c.asignado : '')),
        h('label', null, 'Estado', sel),
        h('label', null, 'Observación (opcional)',
          h('input', { value: it.observacion, placeholder: 'Ej. se escucha ruido en un extremo',
                       oninput: e => { it.observacion = e.target.value; saveDraft(); } }))));
    });
  }

  $('#btnAdd').onclick = () => {
    const v = extraerId($('#idAdd').value) || $('#idAdd').value.trim();
    if (!v) return;
    if (agregar(v)) $('#idAdd').value = '';
  };
  $('#idAdd').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('#btnAdd').click(); } };
  $('#btnVaciar').onclick = () => {
    if (draft.items.length && confirm('¿Vaciar la lista de etiquetas?')) { draft.items = []; saveDraft(); pintarItems(); }
  };

  $('#actividad').value = draft.actividad;
  $('#responsable').value = draft.responsable;
  $('#actividad').oninput = e => { draft.actividad = e.target.value; saveDraft(); };
  $('#responsable').oninput = e => { draft.responsable = e.target.value; saveDraft(); };
  $('#ubicacion').onchange = e => { draft.ubicacion = e.target.value; saveDraft(); };
  function pintarAccion() {
    document.querySelectorAll('[data-acc]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.acc === draft.accion)));
  }
  document.querySelectorAll('[data-acc]').forEach(b => { b.onclick = () => { draft.accion = b.dataset.acc; saveDraft(); pintarAccion(); }; });
  pintarAccion();

  // Lectura continua de NFC (Chrome en Android). En iPhone no existe: se usa la lectura nativa del sistema.
  let nfc = null;
  async function alternarNFC() {
    const b = $('#btnNfc');
    if (nfc) { nfc.abort(); nfc = null; b.textContent = 'Leer etiquetas con NFC'; b.setAttribute('aria-pressed', 'false'); return; }
    if (!('NDEFReader' in window)) {
      toast('Este navegador no lee NFC desde la página. Pasa la etiqueta por el celular y, al abrirse el sitio, toca "Agregar a la actividad".', true);
      return;
    }
    try {
      const r = new NDEFReader(); nfc = new AbortController();
      await r.scan({ signal: nfc.signal });
      b.textContent = 'Leyendo… (toca para parar)'; b.setAttribute('aria-pressed', 'true');
      r.onreading = ev => {
        for (const rec of ev.message.records) {
          let t = '';
          try { t = new TextDecoder(rec.encoding || 'utf-8').decode(rec.data); } catch (e) {}
          const id = extraerId(t);
          if (id) agregar(id);
        }
      };
    } catch (e) { nfc = null; toast('No se pudo activar el NFC: ' + (e.message || e), true); }
  }
  $('#btnNfc').onclick = alternarNFC;

  async function registrar() {
    const msg = $('#msgReg');
    const falla = t => { msg.textContent = t; msg.className = 'err'; };
    if (!draft.actividad.trim()) return falla('Escribe el nombre de la actividad.');
    if (!draft.responsable.trim()) return falla('Escribe quién registra.');
    if (!draft.ubicacion) return falla('Elige la ubicación.');
    if (!draft.items.length) return falla('Agrega al menos una etiqueta.');
    const btn = $('#btnReg'); btn.disabled = true;
    msg.textContent = 'Guardando…'; msg.className = '';
    try {
      const r = await apiPost({
        action: 'registrar', pin: $('#pin').value, actividad: draft.actividad.trim(), responsable: draft.responsable.trim(),
        accion: draft.accion, ubicacion: draft.ubicacion,
        items: draft.items.map(i => ({ id: i.id, estado: i.estado, observacion: i.observacion }))
      });
      if (!r.ok) throw new Error(r.error || 'Error desconocido');
      draft.items = []; draft.actividad = ''; saveDraft();
      $('#actividad').value = '';
      msg.textContent = 'Actividad registrada: ' + r.registrados + (r.registrados === 1 ? ' elemento' : ' elementos') + ' (' + r.codigo + ').';
      msg.className = 'okm';
      hist = null;
      await cargar();
    } catch (e) {
      falla((e instanceof TypeError ? 'No se pudo conectar. Revisa tu conexión; la lista sigue guardada en este celular.' : (e.message || String(e))));
    } finally { pintarItems(); }
  }
  $('#btnReg').onclick = registrar;

  // ---------- Historial ----------
  async function cargarHistorial(force) {
    if (hist && !force) { pintarHistorial(); return; }
    const box = $('#hlista'); box.textContent = 'Cargando…';
    try {
      const r = await apiGet({ action: 'movimientos', limite: 400 });
      if (!r.ok) throw new Error(r.error);
      hist = r.movimientos; pintarHistorial();
    } catch (e) {
      box.textContent = ''; box.append(h('p', { class: 'err' }, 'No se pudo cargar el historial: ' + (e.message || e)));
    }
  }

  function pintarHistorial() {
    const q = $('#hq').value.trim().toLowerCase();
    const box = $('#hlista'); box.textContent = '';
    const rows = (hist || []).filter(m => !q || [m.id, m.descripcion, m.actividad, m.responsable, m.ubicacion, m.accion].join(' ').toLowerCase().includes(q));
    if (!rows.length) { box.append(h('p', { class: 'vacio' }, 'No hay movimientos para mostrar.')); return; }
    const g = new Map();
    rows.forEach((m, i) => {
      const k = m.codigo || ('x' + i);
      if (!g.has(k)) g.set(k, { head: m, items: [] });
      g.get(k).items.push(m);
    });
    g.forEach(grp => {
      const m0 = grp.head;
      box.append(h('details', { class: 'grupo' },
        h('summary', null,
          h('div', { class: 'fila' },
            h('strong', null, m0.actividad || 'Movimiento sin actividad'),
            h('span', { class: 'chip' }, grp.items.length + (grp.items.length === 1 ? ' elemento' : ' elementos'))),
          h('div', { class: 'sub' }, [m0.fecha, m0.accion, m0.ubicacion, m0.responsable].filter(Boolean).join(' · '))),
        grp.items.map(m => h('div', { class: 'mov' },
          h('strong', null, m.id), ' ', m.descripcion || '',
          m.observacion ? h('div', { class: 'sub' }, '“' + m.observacion + '”') : null))));
    });
  }
  $('#hq').oninput = pintarHistorial;

  // ---------- Carga ----------
  async function cargar() {
    const r = await apiGet({ action: 'init' });
    if (!r.ok) throw new Error(r.error);
    D = r;
    llenar($('#fTipo'), D.tipos, 'Todos', F.tipo);
    llenar($('#fEstado'), D.estados, 'Todos', F.estado);
    llenar($('#fUbic'), D.ubicaciones, 'Todas', F.ubic);
    llenar($('#ubicacion'), D.ubicaciones, 'Elige…', D.ubicaciones.includes(draft.ubicacion) ? draft.ubicacion : '');
    $('#ids').textContent = '';
    D.cables.forEach(c => $('#ids').append(h('option', { value: c.id }, c.descripcion)));
    $('#pinBox').hidden = !D.requierePin;
    pintarLista(); pintarItems();
  }

  $('#btnRefrescar').onclick = async () => {
    try { hist = null; await cargar(); toast('Datos actualizados'); } catch (e) { toast('No se pudo actualizar: ' + (e.message || e), true); }
  };

  async function iniciar() {
    if (API_URL.indexOf('PEGA_AQUI') !== -1) {
      $('#lista').append(h('p', { class: 'err' }, 'Falta configurar la dirección de la API (API_URL) al inicio del archivo index.html.'));
      return;
    }
    $('#lista').textContent = 'Cargando…';
    try { await cargar(); }
    catch (e) {
      $('#lista').textContent = '';
      $('#lista').append(h('p', { class: 'err' }, 'No se pudo cargar el inventario: ' + (e.message || e)), h('button', { class: 'pri', onclick: iniciar }, 'Reintentar'));
      return;
    }
    const id = new URLSearchParams(location.search).get('id');
    if (id) abrirFicha(id);
  }
  pintarItems();
  iniciar();
})();
</script>
</body>
</html>
